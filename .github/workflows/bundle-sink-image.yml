# Builds the zeto S17 bundle-server sink image (python + sink.py + the opa binary) and pushes it to ghcr.io. Manual only.
# CI-only build (team rule: no local docker). The pushed digest is pinned in `zeto/k8s/bundle-server/render.sh --sink-image`.
# No cluster access, no secrets beyond the job's GITHUB_TOKEN (packages: write for this repository's package).
name: bundle-sink-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: zeto/k8s/bundle-server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rd-bundle-sink:${{ github.sha }}
      - name: Digest in the job summary
        run: |
          echo "image ghcr.io/${{ github.repository_owner }}/rd-bundle-sink@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tag ${{ github.sha }} (package is private by default; digest is what render.sh --sink-image pins)" >> "$GITHUB_STEP_SUMMARY"
