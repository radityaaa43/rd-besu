name: ci

# Offline checks only: forge test + opa test + render tests (stealth, zeto k8s). No secrets, no cluster, no live chain.
# Live tests (noto+pente/*/src/tests/live-*.ts, zeto/) are not run here.
on: pull_request

permissions:
  contents: read

jobs:
  forge-noto-pente:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: noto+pente/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - run: npm ci
      - run: forge test

  forge-stealth-address:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stealth-address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - run: npm ci
      - run: forge test

  opa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: opa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.21.1
      - run: opa test --coverage bundles/bi bundles/bank test

  stealth-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: stealth-address/k8s/test.sh
      - run: stealth-address/k8s/gateway/test.sh
      - run: stealth-address/k8s/signer/test.sh
      - name: envoy --mode validate on every party config (throwaway certs stand in for Secret st-gw-<N>-mtls)
        run: |
          d="$(mktemp -d)"; chmod 755 "$d"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout "$d/tls.key" -out "$d/tls.crt" -subj /CN=st-gw -days 1
          cp "$d/tls.crt" "$d/ca.crt"; chmod 644 "$d"/*
          for p in bi bank-a bank-b bank-c; do
            stealth-address/k8s/gateway/render.sh envoy "$p" > "$d/$p.yaml"
            docker run --rm -v "$d:/mtls:ro" envoyproxy/envoy@sha256:b1f389c3a6148e85e9de364cb867aa2e5802153abb37ad80f1f2241d693da32a --mode validate -c "/mtls/$p.yaml"
          done

  zeto-k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: zeto/k8s/test.sh
      - run: zeto/k8s/test-besu.sh
      - run: zeto/k8s/test-vote.sh
      - run: zeto/k8s/postgres/test.sh
      - run: zeto/k8s/paladin/test.sh
      - run: zeto/k8s/bundle-server/test.sh
      - run: zeto/k8s/gateway/test.sh
      - run: python3 -I zeto/k8s/test-image-pins.py .
