# stealth L0 (final-design/stealth/PLAN.md S1): one namespace per party on cluster 1.
# Rendered by ../render.sh; ${PARTY} = bi | bank-a | bank-b, ${NS} = rd-stealth-${PARTY}.
# No Paladin node here, so there is no rehearsal egress policy; no lensa-publisher.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NS}
  labels:
    part-of: rd-stealth
    party: ${PARTY}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ${NS}
  labels: {part-of: rd-stealth, party: ${PARTY}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: ${NS}
  labels: {part-of: rd-stealth, party: ${PARTY}}
spec:
  # S7 + S4 + S17: excludes the Vault key store, the RPC node and the signer pods (label app=stealth-signer); policies are additive, so vault-ingress (vault/) and besu-rpc-ingress (rpc/) are their only ingress.
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: NotIn, values: [vault, besu-rpc]}
      - {key: app, operator: NotIn, values: [stealth-signer]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# Egress stays open (Besu p2p to the zeto validators, JWT RPC reads, DNS); no other egress policy exists in this namespace to be widened.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ${NS}
  labels: {part-of: rd-stealth, party: ${PARTY}}
spec:
  # every pod EXCEPT those labelled rd/egress-locked (a signer/scanner/one-off Job with its OWN narrow egress policy; policies are additive, so an
  # allow-all that selects them would cancel it). R17-stealth gate. R17-zeto-other: also the RPC node besu-rpc (key holder; its own narrow policy besu-rpc-egress,
  # egress/render.sh besu-rpc <party>: apply it first, prove the probe, THEN apply this edit) and the Vault key store (key holder with a ServiceAccount token; its own
  # narrow policy vault-egress, egress/render.sh vault <party> --kube-api-ip ...: apply it and prove its probe BEFORE helm install, THEN apply this edit).
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: NotIn, values: [besu-rpc, vault]}
      - {key: rd/egress-locked, operator: DoesNotExist}
  policyTypes: [Egress]
  egress:
    - {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: party-admin
  namespace: ${NS}
  labels: {part-of: rd-stealth, party: ${PARTY}}
---
# secrets: create/update/patch only, never get/list/watch (README decision 25). Not granted here (later steps extend the Role):
# pods/portforward, pods/exec, pods/attach, anything cluster-scoped. Exec into the Vault pod (S7) belongs to the operator's own User/Group only: vault/render.sh operator-exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: party-admin
  namespace: ${NS}
  labels: {part-of: rd-stealth, party: ${PARTY}}
rules:
  - apiGroups: [""]
    resources: [services, configmaps, persistentvolumeclaims, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: party-admin
  namespace: ${NS}
  labels: {part-of: rd-stealth, party: ${PARTY}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: party-admin}
subjects:
  - {kind: ServiceAccount, name: party-admin, namespace: ${NS}}
