pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;  # the gateways poll every 5-15 s; decision logs go to the sink, not here
  client_body_temp_path /tmp/c;
  proxy_temp_path /tmp/p;
  fastcgi_temp_path /tmp/f;
  uwsgi_temp_path /tmp/u;
  scgi_temp_path /tmp/s;
  server {
    listen 8080;
    root /srv;  # ConfigMap layout: /srv/<node>/bi.tar.gz, /srv/<node>/bank.tar.gz (dir = ConfigMap bank-gw-<node>-bundles).
                # PVC layout (zeto/k8s/bundle-server): /srv/<name>/latest.tar.gz + <revision>.tar.gz, written by the sink (POST /bundles/<name>).
    location ~ /\. { return 404; }  # the sink's temp files (.<revision>.tar.gz.tmp) are never served
  }
}
