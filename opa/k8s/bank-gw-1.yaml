# Gateway for Bank Indonesia (node1): Envoy + OPA in one pod, next to (not inside) the operator-owned STS.
# ConfigMaps bank-gw-1-envoy and bank-gw-opa-v2 are created from files (see README). OPA pulls its signed bundles from
# bundle-server (ConfigMap bank-gw-1-bundles is mounted there, not here); --set below is what differs per gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-gw-1
  namespace: paladin
  labels: {app: bank-gw, node: node1}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector:
    matchLabels: {app: bank-gw, node: node1}
  template:
    metadata:
      labels: {app: bank-gw, node: node1}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.38.9@sha256:b1f389c3a6148e85e9de364cb867aa2e5802153abb37ad80f1f2241d693da32a
        args: ["-c", "/config/envoy.yaml", "--log-level", "warn"]
        ports:
        - {name: paladin, containerPort: 8548}
        - {name: besu, containerPort: 8545}
        readinessProbe: {tcpSocket: {port: 8548}, periodSeconds: 5}
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 128Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: envoy, mountPath: /config, readOnly: true}
        - {name: mtls, mountPath: /mtls, readOnly: true} # empty until Secret bank-gw-1-mtls exists (README, mTLS)
      - name: opa
        image: openpolicyagent/opa:1.21.1-envoy-1-static@sha256:c1f40d815a15c4ca0ccbdf300e0a3515fccf1d30fbd92e69917ab96bad83811d
        args:
        - run
        - --server
        - --addr=localhost:8181
        - --diagnostic-addr=0.0.0.0:8282
        - --authorization=basic
        - --config-file=/config/opa.yaml
        - --set=labels.gateway=bank-gw-1
        - --set=bundles.bi.resource=1/bi.tar.gz
        - --set=bundles.bank.resource=1/bank.tar.gz
        - --set=bundles.bank.signing.keyid=bi
        readinessProbe: {httpGet: {path: "/health?plugins&bundles", port: 8282}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8282}, periodSeconds: 10}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: opa, mountPath: /config, readOnly: true}
        - {name: sink-token, mountPath: /sink-token, readOnly: true} # services.sink.credentials.bearer.token_path (opa.yaml)
      volumes:
      - {name: envoy, configMap: {name: bank-gw-1-envoy}}
      - {name: mtls, secret: {secretName: bank-gw-1-mtls, optional: true, defaultMode: 292}} # 0444: envoy runs as uid 10001
      - {name: opa, configMap: {name: bank-gw-opa-v2}}
      - {name: sink-token, secret: {secretName: bundle-sink-token, optional: true, defaultMode: 292}} # 0444; optional: a missing Secret costs decision logs and status posts, never the gateway (README, bundle-server hardening)
---
apiVersion: v1
kind: Service
metadata:
  name: bank-gw-1
  namespace: paladin
  labels: {app: bank-gw, node: node1}
spec:
  selector: {app: bank-gw, node: node1}
  ports:
  - {name: paladin, port: 8548, targetPort: 8548}
  - {name: besu, port: 8545, targetPort: 8545}
