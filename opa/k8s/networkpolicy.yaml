# The public ingress (nginx, basic auth) of paladin-node1..4.apse5.kld.bi-sandbox.com goes straight to paladin-nodeN:8548
# and skips the gateway. Kept open so nothing is cut. Delete this object once the ingress backends point at bank-gw-N
# (k8s/ingress-via-gateway.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paladin-rpc-from-ingress-nginx
  namespace: paladin
  labels: {node: all}
spec:
  podSelector:
    matchLabels: {app: paladin}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app: ingress-nginx}}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app.kubernetes.io/name: ack-ingress-nginx-v1}}
    ports: [{protocol: TCP, port: 8548}]
---
# besu-node-validator-1: 8545 from bank-gw-1 and paladin-node1; WS 8546 from paladin-node1; P2P 30303 from the besu namespace; metrics 9545 open. 8547 (GraphQL, off) closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: besu-node-validator-1-ingress
  namespace: besu
  labels: {node: node1}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: besu-node-validator-1}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: paladin}}
      podSelector: {matchLabels: {app: bank-gw, node: node1}}
    ports: [{protocol: TCP, port: 8545}]
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: paladin}}
      podSelector: {matchLabels: {app: paladin, app.kubernetes.io/instance: node1}}
    ports: [{protocol: TCP, port: 8545}, {protocol: TCP, port: 8546}]
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: besu}}
    ports: [{protocol: TCP, port: 30303}, {protocol: UDP, port: 30303}]
  - ports: [{protocol: TCP, port: 9545}]
---
