# Ingress NetworkPolicies for the Paladin and Besu RPC doors. In-cluster, only the OPA gateways reach the RPC ports,
# plus the flows listed in README "NetworkPolicy". Ingress only: no egress rule anywhere here.
# The cluster CNI is Terway v1.15.0 (eBPF policy provider, eni-config disable_network_policy=false): these are enforced.
# Not covered: `kubectl port-forward` (the kubelet dials the pod from its node; policy does not apply).
# Apply one node at a time: kubectl apply -f networkpolicy.yaml -l node=node4 (README, "NetworkPolicy"). Deleting an object opens that node again.
---
# paladin-node1: RPC 8548 from every bank-gw (BI's Noto balance controls: gateways 2-4 ask node1, the notary, for balances and supply, bundles/bi/bi/noto/balance.rego); 8548+8549 from the operator and DFABI bank1-backend; transport 9000 from Paladin nodes; metrics 6100 open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paladin-node1-ingress
  namespace: paladin
  labels: {node: node1}
spec:
  podSelector:
    matchLabels: {app: paladin, app.kubernetes.io/instance: node1}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: bank-gw}}
    ports: [{protocol: TCP, port: 8548}]
  - from:
    - podSelector: {matchLabels: {app.kubernetes.io/name: paladin-operator}}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: dfabi}}
      podSelector: {matchLabels: {app: bank1-backend}}
    ports: [{protocol: TCP, port: 8548}, {protocol: TCP, port: 8549}]
  - from:
    - podSelector: {matchLabels: {app: paladin}}
    ports: [{protocol: TCP, port: 9000}]
  - ports: [{protocol: TCP, port: 6100}]
---
