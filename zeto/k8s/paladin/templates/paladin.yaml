# zeto S9: Paladin operator + Paladin node CR for one party, namespaced. Placeholders: ${PARTY} ${NS} ${N} (render.sh).
# Operator objects are the upstream chart's (paladin@v1.0.0:operator/charts/paladin-operator/templates/operator/*.yaml) with
# values equal to the live operator in ns paladin: image pinned by the digest the live pod runs, WATCH_NAMESPACE from the pod namespace.
# No Service (the chart's is unused: the manager serves health on 8081 only), no cluster-scoped object, no Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paladin-operator
  namespace: ${NS}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paladin-operator
  namespace: ${NS}
rules:
  - apiGroups: [core.paladin.io]
    resources: [smartcontractdeployments, transactioninvokes, besus, paladins, besugeneses, paladinregistries, paladindomains, paladinregistrations]
    verbs: [get, list, patch, update, watch]
  - apiGroups: [core.paladin.io]
    resources: [smartcontractdeployments/status, transactioninvokes/status, besus/status, paladins/status, besugeneses/status, paladinregistries/status, paladindomains/status, paladinregistrations/status]
    verbs: [get, patch, update]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, create, delete, update, patch, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, create, delete, update, patch, watch]
  - apiGroups: [""]
    resources: [services, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, create, delete, update, patch, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, delete, update, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paladin-operator
  namespace: ${NS}
subjects:
  - {kind: ServiceAccount, name: paladin-operator, namespace: ${NS}}
roleRef: {kind: Role, name: paladin-operator, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paladin-operator
  namespace: ${NS}
data:
  config.json: |
    {"paladin":{"image":"ghcr.io/radityaaa43/paladin@sha256:3c8681149cfa37eb6d4e9312e61a704dbd2c179901f01d2b3ae17713c2711c77","imagePullPolicy":"Always","labels":{"app":"paladin"},"annotations":null,"envs":null,"tolerations":null,"affinity":{"podAntiAffinity":__ANTI__},"nodeSelector":null,"securityContext":null},"besu":{"image":"hyperledger/besu:25.8.0","imagePullPolicy":"IfNotPresent","labels":{"app":"besu"},"annotations":null,"envs":null,"tolerations":null,"affinity":null,"nodeSelector":null,"securityContext":null},"postgres":{"image":"postgres:17.6","imagePullPolicy":"IfNotPresent","labels":null,"annotations":null,"envs":null}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paladin-operator
  namespace: ${NS}
  labels: {app.kubernetes.io/name: paladin-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: paladin-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: paladin-operator}
    spec:
      serviceAccountName: paladin-operator
      securityContext: {runAsNonRoot: true}
      containers:
        - name: paladin-operator
          image: docker.io/lfdecentralizedtrust/paladin-operator:v1.0.0@sha256:e778ee8123e0ce1e6a9efea9aacd64e139b0229cd2e112b1d3b30973cefcd9c3
          imagePullPolicy: IfNotPresent
          command: [/manager]
          env:
            - name: WATCH_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: CONFIG_PATH, value: /etc/config}
          livenessProbe: {httpGet: {path: /healthz, port: 8081, scheme: HTTP}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 1}
          readinessProbe: {httpGet: {path: /readyz, port: 8081, scheme: HTTP}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 1}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/config/config.json, subPath: config.json}
      volumes:
        - name: config
          configMap: {name: paladin-operator}
---
# Paladin pods get no resources from the operator: it sets none on the container (paladin_controller.go only sizes PVCs), the CR has no resources
# field and the stub's containers are replaced wholesale on every reconcile (:297-306). The namespace default therefore comes from a LimitRange.
# Old node1: ~940 Mi RSS, 4 m CPU idle (measured 2026-11-11). 2026-11-13: Zeto proving of many-input locks reached 4.8 Gi RSS on node2 and the
# K8s nodes OOM-killed node2 and node4 (SystemOOM, victim java) while they were BestEffort: 1 CPU / 3Gi requested, capped at 3 / 6Gi
# (JVM default heap = 25% of the limit = 1.5Gi; it was 25% of the K8s node, ~1.6Gi).
# 2026-11-18 (user): limit raised 6Gi -> 8Gi with the Lensa Zeto concurrency caps removed; request unchanged. Member workers have
# 6.2Gi allocatable and run 70-91% requested, so the worker, not this limit, is the real ceiling until unused pods are removed.
# 2026-11-18 (user "naikkan cpu"): CPU limit 3 -> 4 = a whole worker (ecs.c8a.xlarge, 4 vCPU, the largest in both clusters).
# A Zeto transfer costs ~4 CPU-s (mostly the ZK proof) and node1/node4 were CFS-throttled 18% of periods at 3; request unchanged.
apiVersion: v1
kind: LimitRange
metadata:
  name: paladin-defaults
  namespace: ${NS}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: "1", memory: 3Gi}
      default: {cpu: "4", memory: 8Gi}
---
# Paused stub (orchestrator deviation: no rehearsal start; PLAN S9 "scaled to 0"). The Paladin CR has no replicas field. The operator creates
# its StatefulSet only if none exists (paladin_controller.go:287-292) and on update touches only containers, volumes and template annotations/
# labels (:297-306), never replicas. This stub therefore keeps the node unstarted while the operator generates the pldconf ConfigMap. It carries
# no ownerReference, so deleting the Paladin CR does NOT delete it. The real start at S21: kubectl -n ${NS} scale sts paladin-node${N} --replicas=1.
# Name, selector and labels equal what the operator would create (generateStatefulSetTemplate, :372-): app=paladin from the operator config labels.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paladin-node${N}
  namespace: ${NS}
  labels: &lab {app: paladin, app.kubernetes.io/instance: node${N}, app.kubernetes.io/name: paladin-node${N}, app.kubernetes.io/part-of: paladin}
spec:
  replicas: 0
  selector:
    matchLabels: *lab
  template:
    metadata:
      labels: *lab
    spec:
      containers:
        - name: paladin
          image: ghcr.io/radityaaa43/paladin@sha256:3c8681149cfa37eb6d4e9312e61a704dbd2c179901f01d2b3ae17713c2711c77
---
# Domains and the registry are static node config (PLAN S9 DELTA): the operator would otherwise deploy NEW factory/registry
# contracts from PaladinDomain/PaladinRegistry/SmartContractDeployment CRs. "A domain is either wholely defined in the static config of
# the node, or wholely defined by reference to the CR attached. We do not attempt to merge" (paladin_controller.go:1194-1196).
# Addresses are the live ones (CONTRACTS.md); test/check.py compares this block with the config the live operator generated for node1.
apiVersion: core.paladin.io/v1alpha1
# OPTION D (S21 attempt 3, R14): this render carries NO database.passwordSecret, NO dsn and NO dsnParams. The fork logs a templated DSN with the
# password at WARN (`REMOVE: DSN=`, gorm.go:133) only on that path. The Job zeto/k8s/postgres/rotate writes `db.postgres.dsn` (hex password) into the LIVE
# CR's spec.config right after `  postgres:`; the live CR is the only holder. Re-applying this render wipes the dsn: run the Job again afterwards.
kind: Paladin
metadata:
  name: node${N}
  namespace: ${NS}
spec:
  baseLedgerEndpoint:
    type: endpoint
    endpoint:
      jsonrpc: http://besu-rpc.${NS}.svc.cluster.local:8545
      ws: ws://besu-rpc.${NS}.svc.cluster.local:8546
  database:
    mode: preConfigured
    migrationMode: auto
  domains: []
  registries: []
  secretBackedSigners:
    - name: signer-1
      secret: node${N}.keys
      type: autoHDWallet
      derivationType: bip32
      keySelector: .*
      keySelectorMustNotMatch: false
  service:
    type: ClusterIP
    ports:
      - {name: rpc-http, port: 8548, protocol: TCP}
      - {name: rpc-ws, port: 8549, protocol: TCP}
      - {name: metrics, port: 6100, protocol: TCP}
  transports:
    - name: grpc
      plugin: {type: c-shared, library: /app/transports/libgrpc.so}
      configJSON: |
        {
          "port": 9000,
          "address": "0.0.0.0"
        }
      ports:
        - {name: transport-grpc, port: 9000, targetPort: 9000, protocol: TCP}
  config: |
    log:
      level: info
    keyManager:
      disableSignRPC: true
    # The assemble request (Zeto proof inside) expires at now + stateTimeout (sequencer/coordinator/transaction/assembling.go:150). The 10s
    # default cancelled proofs of many-input locks and re-pooled them; the retries piled up until the K8s node ran out of memory (2026-11-12).
    # maxInflightTransactions caps the coordinator's in-memory transactions per contract. A confirmed tx stays there for
    # closingGracePeriod+1 heartbeats (~26 s at the 10s default), so the default 500 capped one Noto contract at ~12 TPS
    # (PD012642 on the notary node1, 2026-11-18). Official sequencerManager key, default 500.
    # blockRange (default 100, min 10, must be equal on all nodes) is the coordinator epoch; COORDINATOR_ENDORSER (Pente) rotates its
    # submitter key at each epoch. Under load the RD hooks group rotated while old-key hooks were unconfirmed, new-key hooks ran first
    # and reverted PenteInputNotAvailable, wedging the chain (blocks 2656301, 2658904; 2026-11-18). 100000 (~55 h) = rare rotations.
    # maxDispatchAhead (default 50) caps dispatched-but-unconfirmed txs per coordinator (dispatch_loop.go). Every Noto RD transfer runs a
    # chained Pente hook on node1, so blocks carried exactly 50 hooks and RD plateaued at ~23 TPS at C=96..288 (2026-11-18).
    sequencerManager:
      stateTimeout: 60s
      maxInflightTransactions: 2000
      blockRange: 100000
      maxDispatchAhead: 200
    db:
      type: postgres
      # statementCache false (official db.postgres.statementCache, default true for postgres) + role plan_cache_mode=force_custom_plan
      # (zeto/k8s/postgres/README.md). NEVER put default_query_exec_mode=exec in the DSN (pgx then sent JSON as bytea hex into
      # text columns and corrupted 276 rows, 2026-11-18 06:02Z). Without these the Zeto SMT label lookup falls to
      # a generic plan (LFDT-Paladin/paladin#1073) that took 76-94 ms on node2/node3 vs 0.04 ms, so their HandleEventBatch ran 23-59 s
      # and receipts lagged the chain by 100-220 s (2026-11-18).
      postgres:
        statementCache: false
    domains:
      noto:
        plugin: {type: c-shared, library: /app/domains/libnoto.so}
        config: {factoryVersion: 2}
        registryAddress: '0x1419f612c603466f254ca71e78a324c0d922daf3'
      pente:
        plugin: {type: jar, library: /app/domains/pente.jar, class: io.kaleido.paladin.pente.domain.PenteDomainFactory}
        config: {}
        registryAddress: '0x199804944e574c6f726f5aa13b343c6cd2c73254'
      zeto:
        plugin: {type: c-shared, library: /app/domains/libzeto.so}
        config:
          domainContracts:
            implementations:
              - name: Zeto_Anon_V1
                forZetoVariant: 1
                circuits:
                  deposit: {name: deposit}
                  transfer: {name: anon}
                  transferLocked: {name: anon}
                  withdraw: {name: withdraw}
              - name: Zeto_AnonNullifier
                forZetoVariant: 1
                circuits:
                  deposit: {name: deposit}
                  transfer: {name: anon_nullifier_transfer, usesNullifiers: true}
                  transferLocked: {name: anon}
                  withdraw: {name: withdraw_nullifier, usesNullifiers: true}
          # maxProverPerCircuit (official SnarkProverConfig, default 10): proofs that may run at once per circuit. 3 on a 4 vCPU worker
          # (2026-11-18, user): at 10, up to 10 proofs shared 4 cores and Signing took 8-9 s per tx instead of 1.67 s.
          snarkProver:
            circuitsDir: /app/domains/zeto/zkp
            provingKeysDir: /app/domains/zeto/zkp
            maxProverPerCircuit: 3
        registryAddress: '0x753a64eac771adff2ff9d879585fa3bdde76cf91'
        allowSigning: true
        defaultGasLimit: 30000000
    registries:
      evm-registry:
        plugin: {type: c-shared, library: /app/registries/libevm.so}
        config:
          contractAddress: '0x99f3326e056b418e40c62bbbd2ffdafd48bd7874'
