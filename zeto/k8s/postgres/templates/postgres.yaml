# zeto S8 (final-design/zeto/PLAN.md): one PostgreSQL per party in its namespace, README decision 27 (sidecar-style Postgres, same image line
# as today, own PVC). Rendered by ../render.sh; ${PARTY} = bi | bank-a | bank-b, ${NS} = rd-zeto-${PARTY}.
# The Secret `paladin-pg-credentials` (keys username, password, database) is NOT in git: the party creates it, see README.
apiVersion: v1
kind: Service
metadata:
  name: paladin-pg
  namespace: ${NS}
  labels: {part-of: rd-zeto, party: ${PARTY}}
spec:
  type: ClusterIP
  selector: {app: paladin-pg}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paladin-pg
  namespace: ${NS}
  labels: {part-of: rd-zeto, party: ${PARTY}}
spec:
  serviceName: paladin-pg
  replicas: 1
  selector:
    matchLabels: {app: paladin-pg}
  template:
    metadata:
      labels: {app: paladin-pg, part-of: rd-zeto, party: ${PARTY}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        # member-16033 (97% CPU requests) and member-16034 (85%) are the loaded nodes of cluster 1 (zeto CURRENT section 12); hostname labels per besu (member-16033-node, member-16034-node);
        # read from the live node labels by besu, not by this PR.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [member-16033-node, member-16034-node]}
        podAntiAffinity:
          # one party database per node, across namespaces
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
              labelSelector:
                matchLabels: {app: paladin-pg}
          # and, if possible, not next to a Besu validator (label app.kubernetes.io/name=besu is [unverified]; preferred, so a wrong label only loses the hint)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector: {}
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: besu}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: paladin-pg-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: paladin-pg-credentials, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: paladin-pg-credentials, key: database}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          # Sizes are a first guess: today's sidecar usage was not read [unverified]; tune before S9.
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -p 5432']}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -p 5432']}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -p 5432']}
            periodSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {part-of: rd-zeto, party: ${PARTY}}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: alicloud-essd-wffc   # WaitForFirstConsumer: the disk is created in the zone of the node the pod lands on (alicloud-essd is Immediate)
        resources:
          requests: {storage: 20Gi}
---
# Only Paladin pods of this namespace reach the database. NetworkPolicies are additive, so S1's allow-same-namespace excludes app=paladin-pg.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paladin-pg-ingress
  namespace: ${NS}
  labels: {part-of: rd-zeto, party: ${PARTY}}
spec:
  podSelector:
    matchLabels: {app: paladin-pg}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: paladin}
      ports:
        - {protocol: TCP, port: 5432}
