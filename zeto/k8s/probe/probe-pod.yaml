# Throwaway egress proof for zeto S1, part 2: probe pods (rendered twice: ${POD} = probe-paladin with app=paladin, probe-control with
# app=probe-control). Expected `kubectl logs` (own = ${NS}, other = ${OTHER_NS}):
#   probe-paladin   OTHER-9000 BLOCKED   <- the proof: rehearsal-no-9000-egress works
#   probe-paladin   OWN-8549   OPEN      (same-namespace traffic and the 1-8999 range work)
#   probe-control   OTHER-9000 OPEN      (control: the listener is reachable, so BLOCKED above comes from the policy, not from ingress)
# probe-paladin OTHER-9000 OPEN = the CNI ignores endPort: S1 stops and goes to lead. DNS-FAIL = DNS egress is broken: not a result.
apiVersion: v1
kind: Pod
metadata:
  name: ${POD}
  namespace: ${NS}
  labels: {throwaway: zeto-s1-probe, app: ${APP}}
spec:
  restartPolicy: Never
  containers:
    - name: p
      image: python:3.12-alpine
      env:
        - {name: WHO, value: ${POD}}
        - {name: OTHER, value: "probe-listener-9000.${OTHER_NS}.svc.cluster.local"}
        - {name: OWN, value: "probe-listener-8549.${NS}.svc.cluster.local"}
      command:
        - python
        - -u
        - -c
        - |
          import os, socket, time
          def probe(label, host, port):
              try:
                  socket.gethostbyname(host)
              except OSError:
                  print(os.environ["WHO"], label, "DNS-FAIL", flush=True); return
              try:
                  socket.create_connection((host, port), timeout=5).close(); r = "OPEN"
              except OSError:
                  r = "BLOCKED"
              print(os.environ["WHO"], label, r, flush=True)
          probe("OTHER-9000", os.environ["OTHER"], 9000)
          probe("OWN-8549", os.environ["OWN"], 8549)
          time.sleep(600)
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65534, capabilities: {drop: [ALL]}}
