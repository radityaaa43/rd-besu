# Throwaway egress proof for zeto S1 (PLAN S1 RED), part 1: listeners. Rendered by ../render.sh probe <own-party> <other-party>.
# default-deny-ingress would block the listeners and make every probe result BLOCKED for the wrong reason, so the other
# namespace gets a throwaway ingress-allow for 9000. Everything here carries throwaway=zeto-s1-probe: delete by that label.
# Image python:3.12-alpine is already on the nodes (bundle-server sink).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probe-allow-9000
  namespace: ${OTHER_NS}
  labels: {throwaway: zeto-s1-probe}
spec:
  podSelector:
    matchLabels: {role: probe-listener}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {part-of: rd-zeto}
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-listener-9000
  namespace: ${OTHER_NS}
  labels: {throwaway: zeto-s1-probe, role: probe-listener, listen: "9000"}
spec:
  restartPolicy: Never
  containers:
    - name: l
      image: python:3.12-alpine
      command: [python, -c, "import socketserver as s;s.TCPServer(('0.0.0.0',9000),s.BaseRequestHandler).serve_forever()"]
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65534, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: probe-listener-9000
  namespace: ${OTHER_NS}
  labels: {throwaway: zeto-s1-probe}
spec:
  selector: {role: probe-listener, listen: "9000"}
  ports: [{port: 9000, targetPort: 9000}]
---
